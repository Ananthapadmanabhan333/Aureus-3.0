name: AUREUS-RV 3.0 Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen || uv sync

      - name: Lint with Ruff
        run: uv run ruff check src tests scripts

      - name: Run pytest suite
        run: uv run pytest -v

      - name: Run CLI end-to-end verification
        run: |
          uv run python scripts/generate_demo_data.py --output-dir artifacts/ci_demo
          uv run python scripts/validate_dataset.py --input artifacts/ci_demo/synthetic_mcx_gold.parquet
          uv run python scripts/run_research.py --input artifacts/ci_demo/synthetic_mcx_gold.parquet --output-dir artifacts/ci_run
